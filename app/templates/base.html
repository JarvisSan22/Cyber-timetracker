<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11161d">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Hobby Tracker{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  <header class="topbar container">
    {% if page in ("timer", "stats") %}
    <form class="picker" method="get" action="{{ '/stats' if page == 'stats' else '/' }}">
      <span class="dot" style="--c: {{ project.color if project else '#94a3b8' }}"></span>
      <select name="project" aria-label="Project" onchange="this.form.submit()">
        {% if page == "stats" %}
        <option value="all" {% if not project %}selected{% endif %}>All projects</option>
        {% endif %}
        {% for p in projects %}
        <option value="{{ p.id }}" {% if project and p.id == project.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
        {% if project and project.archived %}
        <option value="{{ project.id }}" selected>{{ project.name }} (archived)</option>
        {% endif %}
      </select>
      <noscript><button type="submit">Go</button></noscript>
      {% if project %}<a class="icon-btn" href="/projects#project-{{ project.id }}" title="Edit project" aria-label="Edit project">✎</a>{% endif %}
      <a class="icon-btn" href="/projects#new" title="New project" aria-label="New project">＋</a>
    </form>
    <nav class="tabs" aria-label="Main">
      <a href="/" {% if page == "timer" %}aria-current="page"{% endif %}>Timer</a>
      <a href="/stats" {% if page == "stats" %}aria-current="page"{% endif %}>Statistics</a>
    </nav>
    {% else %}
    <h1 class="page-title">{% block heading %}{% endblock %}</h1>
    {% endif %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container footer-nav">
    <nav aria-label="More">
      <a href="/" {% if page == "timer" %}aria-current="page"{% endif %}>Timer</a>
      <a href="/stats" {% if page == "stats" %}aria-current="page"{% endif %}>Statistics</a>
      <a href="/projects" {% if page == "projects" %}aria-current="page"{% endif %}>Projects</a>
      <a href="/ideas" {% if page == "ideas" %}aria-current="page"{% endif %}>Ideas</a>
      <a href="/settings" {% if page == "settings" %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </footer>

  <div id="modal"></div>
  <div id="toast" aria-live="polite"></div>
</body>
</html>
